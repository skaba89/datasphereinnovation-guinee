name: DSIG CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Python regression tests
        run: |
          python -m pip install -r requirements.txt
          python -m unittest -v
          python -m unittest discover -s scripts -p 'test_qualification_image.py' -v
      - name: Shell syntax
        run: bash -n scripts/backup-rec.sh && bash -n scripts/acceptance-isolated.sh && bash -n scripts/prepare-rec-upgrade.sh
      - name: JavaScript syntax
        run: for f in dist/*.js; do node --check "$f" || exit 1; done
      - name: Public SEO export
        run: |
          node scripts/test-public-site.mjs
          node scripts/test-public-indexing.mjs
          node scripts/test-public-release-gate.mjs
          node scripts/test-legal-compliance.mjs
          node scripts/test-public-form.mjs
          python scripts/test-monitor-public.py
  browser-acceptance:
    # Keep browser system dependencies on the established LTS runner.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          for attempt in 1 2 3; do
            if python -m playwright install --with-deps chromium; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Playwright dependency installation failed after three attempts"
              exit 1
            fi
            sleep "$((attempt * 10))"
          done
      - name: Browser acceptance tests
        run: python -m unittest -v browser_e2e
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate isolated candidate configuration
        env:
          DSIG_CANDIDATE_ADMIN_TOKEN: ci-fictitious-token-not-a-secret-123456
          DSIG_CANDIDATE_MFA_KEY: ci-placeholder
          DSIG_CANDIDATE_BACKUP_KEY: ci-placeholder
          DSIG_CANDIDATE_DOCUMENT_KEY: ci-placeholder
          DSIG_CLAMD_GID: '109'
        run: |
          docker compose -f compose.prod-candidate.yaml config --quiet
          docker compose -f compose.prod-candidate.yaml config --format json | python -c "import json,sys; c=json.load(sys.stdin); s=c['services']['candidate']; assert c['name']=='dsig-prod-candidate'; assert s['environment']['DSIG_ENV']=='REC'; assert s['ports'][0]['host_ip']=='127.0.0.1'; assert 'candidate-data' in c['volumes']; assert 'edge' not in c['networks']"
      - name: Validate disabled PROD review topology
        env:
          DSIG_PROD_IMAGE: dsig.invalid/app@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          DSIG_PROD_MFA_KEY: ci-placeholder
          DSIG_PROD_BACKUP_KEY: ci-placeholder
          DSIG_PROD_DOCUMENT_KEY: ci-placeholder
          DSIG_PROD_CLAMD_GID: '109'
          DSIG_PROD_PORT: '8320'
        run: |
          docker compose -f compose.prod.yaml --profile prod-review config --quiet
          docker compose -f compose.prod.yaml --profile prod-review config --format json | python -c "import json,sys; c=json.load(sys.stdin); s=c['services']['app']; assert c['name']=='dsig-prod'; assert s['environment']['DSIG_ENV']=='PROD'; assert s['ports'][0]['host_ip']=='127.0.0.1'; assert c['volumes']['prod-data']['name']=='dsig-prod_prod-data'; assert c['networks']['prod-private']['internal']; assert 'edge' not in c['networks']; assert s['entrypoint'][2].startswith('raise SystemExit'); assert s['user']=='10001:10001'; assert s['read_only']; assert s['restart']=='no'; assert s['pull_policy']=='never'"
      - name: Validate actual resolved PROD topology and isolated secrets
        run: |
          python -m venv "$RUNNER_TEMP/dsig-prod-check"
          "$RUNNER_TEMP/dsig-prod-check/bin/python" -m pip install -r requirements.txt
          "$RUNNER_TEMP/dsig-prod-check/bin/python" scripts/test-prod-compose-integration.py
      - name: Build local image
        run: |
          # Reproduce the private checkout permissions used on the VPS.
          find . -maxdepth 1 -type f -name '*.py' -exec chmod 0600 {} +
          chmod 0600 requirements.txt
          find dist -type d -exec chmod 0700 {} +
          find dist -type f -exec chmod 0600 {} +
          docker build -t dsig-ci .
      - name: Verify application image content in isolated sandbox
        run: python scripts/verify-prod-image.py "$(git rev-parse HEAD)" dsig-ci --ci-local
      - name: Qualify private signed handoff inside isolated Docker
        run: bash scripts/qualify-private-docker.sh dsig-ci
      - name: Qualify host-to-container signed handoff
        run: |
          "$RUNNER_TEMP/dsig-prod-check/bin/python" scripts/qualify-private-cross-namespace.py dsig-ci
      - name: Qualify persistent volume across Docker replacement
        run: |
          "$RUNNER_TEMP/dsig-prod-check/bin/python" scripts/qualify-private-replacement.py dsig-ci
      - name: Verify Docker backup source and restored synthetic record
        run: |
          image_id=$(docker image inspect --format '{{.Id}}' dsig-ci)
          "$RUNNER_TEMP/dsig-prod-check/bin/python" scripts/test-prod-docker-rehearsal.py --qualification-image-id "$image_id"
      - name: Verify local container
        run: |
          docker run -d --name dsig-ci -p 127.0.0.1:8080:8080 -e DSIG_ENV=REC -e DSIG_ADMIN_TOKEN=ci-fictitious-token-not-a-secret-123456 dsig-ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/api/health
          curl -fsS http://127.0.0.1:8080/api/ready
          curl -fsS http://127.0.0.1:8080/ >/dev/null
      - name: Verify deployed commit content
        run: |
          for i in $(seq 1 40); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' dsig-ci)" = healthy ]; then break; fi
            sleep 2
          done
          python scripts/verify-rec-release.py "$(git rev-parse HEAD)" --container dsig-ci
      - name: Verify isolated candidate regression suite
        run: bash scripts/acceptance-isolated.sh
      - name: Cleanup
        if: always()
        run: docker rm -f dsig-ci || true
  public-docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build static public image
        run: |
          # Reproduce a private VPS checkout (umask 077).
          chmod 0600 deploy/public/Caddyfile
          find dist -type f -exec chmod 0600 {} +
          docker build -f Dockerfile.public --build-arg DSIG_PUBLIC_EMAIL=contact@datasphere-innovation.net -t dsig-public:ci .
      - name: Validate both public Caddyfiles with Caddy itself
        run: |
          node scripts/public-caddyfile.mjs deploy/public/Caddyfile enabled > Caddyfile.enabled
          docker run --rm -v "$PWD/Caddyfile.enabled:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm --entrypoint caddy dsig-public:ci validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Public form build refused while legal data is incomplete
        run: |
          ! docker build -f Dockerfile.public --build-arg DSIG_PUBLIC_EMAIL=contact@datasphere-innovation.net --build-arg DSIG_PUBLIC_FORM=enabled -t dsig-public:form-refused . 2>build.log
          grep -q 'legal information is incomplete' build.log
          ! docker build -f Dockerfile.public --build-arg DSIG_PUBLIC_EMAIL=contact@datasphere-innovation.net --build-arg DSIG_PUBLIC_FORM=yes -t dsig-public:bad-mode . 2>/dev/null
          test "$(docker inspect -f '{{ index .Config.Labels "com.dsig.public.form" }}' dsig-public:ci)" = disabled
      - name: Validate composition
        env:
          DSIG_PUBLIC_IMAGE: dsig-public:ci
        run: |
          bash -n scripts/deploy-public.sh
          docker compose -f compose.public.yaml config --quiet
      - name: Test isolated static container
        run: |
          docker run -d --name dsig-public-ci --read-only --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp --tmpfs /data:uid=10001,gid=10001 --tmpfs /config:uid=10001,gid=10001 -p 127.0.0.1:8080:8080 dsig-public:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/ | grep 'rel="canonical" href="https://dsig-consulting.com/"'
          curl -fsS http://127.0.0.1:8080/sitemap.xml | grep 'https://dsig-consulting.com/en.html'
          curl -fsSI http://127.0.0.1:8080/ | grep -i "^content-security-policy: default-src 'self'; script-src 'self'; style-src 'self'"
          curl -fsSI http://127.0.0.1:8080/ | grep -i '^permissions-policy: '
          for route in /mentions-legales.html /legal-en.html /confidentialite.html /privacy-en.html; do
            curl -fsS "http://127.0.0.1:8080$route" | grep 'content="noindex,nofollow"'
          done
          ! curl -fsS http://127.0.0.1:8080/sitemap.xml | grep -E 'mentions-legales|legal-en'
          for route in /accounts.html /connexion.html /api/admin/requests /.env /server.py; do
            test "$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$route")" = 404
          done
      - name: Test isolated PROD contact service image
        run: |
          docker build -f Dockerfile.contact -t dsig-contact:ci .
          ! docker run --rm dsig-contact:ci ls /app/server.py
          key=$(docker run --rm dsig-contact:ci python -c "from cryptography.fernet import Fernet;print(Fernet.generate_key().decode())")
          docker run -d --name dsig-contact-ci --read-only --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp -v dsig-contact-ci:/data -e DSIG_CONTACT_KEY="$key" -p 127.0.0.1:8090:8090 dsig-contact:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8090/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8090/healthz | grep '"accepting": false'
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -H 'Origin: https://dsig-consulting.com' -d '{}' http://127.0.0.1:8090/api/contact)" = 503
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/api/admin/requests)" = 404
          docker run --rm -v dsig-contact-ci:/data -e DSIG_CONTACT_KEY="$key" dsig-contact:ci python contact_service.py --purge
          DSIG_CONTACT_IMAGE=dsig-contact:ci DSIG_CONTACT_ENV_FILE=/dev/null docker compose -f compose.contact.yaml config --quiet
      - name: Cleanup contact container
        if: always()
        run: docker rm -f dsig-contact-ci || true; docker volume rm dsig-contact-ci || true
      - name: Cleanup public container
        if: always()
        run: docker rm -f dsig-public-ci || true
