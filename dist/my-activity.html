<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>DSIG | Espace consultant</title><link rel="stylesheet" href="admin.css"><script src="my-activity.js" defer></script><script src="shared-session.js" defer></script></head><body><header><img src="dsig-mark.svg" alt="DSIG" width="100"><span>Espace consultant</span><a href="index.html">Site vitrine</a></header><main><h1>Mes missions et CRA</h1><section id="login"><form id="login-form"><label>Clé individuelle<input id="token" type="password" required></label><button>Connexion</button></form></section><p id="notice" role="status"></p><div id="workspace" hidden><button id="logout">Déconnexion</button><section><h2>Soumettre un CRA</h2><form id="cra"><label>Mission<select name="mission_id" id="mission" required></select></label><label>Date<input name="work_date" type="date" required></label><label>Jours travaillés<input name="worked" type="number" min="0.01" max="1" step="0.01" required></label><label>Jours facturables (0 au forfait)<input name="billable" type="number" min="0" max="1" step="0.01" value="0" required></label><label>Frais directs<input name="expenses" type="number" min="0" step="0.01" value="0" required></label><label>Description<input name="description" required maxlength="2000"></label><button>Soumettre</button></form></section><section><h2>Mes 100 derniers CRA</h2><div class="table-wrap"><table><thead><tr><th>Mission</th><th>Date</th><th>Jours</th><th>Statut</th></tr></thead><tbody id="rows"></tbody></table></div></section></div></main></body></html>
