<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="app.webmanifest"><meta name="theme-color" content="#35104e"><link rel="apple-touch-icon" href="apple-touch-icon.png"><script src="pwa.js" defer></script><meta name="robots" content="noindex,nofollow"><title>DSIG | Modèles d’e-mails</title><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="accessibility.css"><link rel="stylesheet" href="client.css"><script src="modeles-email.js" defer></script><script src="shared-session.js" defer></script></head><body><a class="skip-link" href="#main">Aller au contenu</a><header><span>Modèles d’e-mails</span><a href="crm.html">CRM</a></header><main id="main" tabindex="-1"><h1>Modèles d’e-mails commerciaux</h1><p class="muted">Champs disponibles : <code>{contact}</code>, <code>{societe}</code>, <code>{opportunite}</code>, <code>{commercial}</code>. Tout autre champ entre accolades est refusé. Gestion réservée aux administrateurs.</p><section id="login"><h2>Accès réservé</h2><form id="login-form"><label>Clé de session<input id="token" type="password" required autocomplete="off"></label><button>Se connecter</button></form></section><p id="notice" role="status" aria-live="polite"></p><div id="workspace" hidden><div class="toolbar"><button id="new-template" type="button">Nouveau modèle</button><button id="logout" type="button">Se déconnecter</button></div><section id="editor-section" hidden><h2 id="editor-title">Modèle</h2><form id="editor" class="composer-form"><label>Nom<input name="name" required maxlength="120"></label><label>Langue<select name="language"><option value="fr">Français</option><option value="en">Anglais</option></select></label><label>Actif<select name="active"><option value="true">Oui</option><option value="false">Non</option></select></label><label class="composer-body">Objet<input name="subject" required maxlength="200"></label><label class="composer-body">Message<textarea name="body" rows="12" required maxlength="4000"></textarea></label><button>Enregistrer</button><button type="button" id="cancel">Annuler</button></form></section><div class="table-wrap" tabindex="0" role="region" aria-label="Modèles d’e-mails"><table><thead><tr><th scope="col">Nom</th><th scope="col">Langue</th><th scope="col">Objet</th><th scope="col">Statut</th><th scope="col">Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></main></body></html>
