<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="app.webmanifest"><meta name="theme-color" content="#35104e"><link rel="apple-touch-icon" href="apple-touch-icon.png"><script src="pwa.js" defer></script><meta name="robots" content="noindex,nofollow"><title>DSIG | Tâches commerciales</title><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="accessibility.css"><link rel="stylesheet" href="dashboard.css"><link rel="stylesheet" href="taches.css"><script src="taches.js" defer></script><script src="shared-session.js" defer></script></head><body><a class="skip-link" href="#main">Aller au contenu</a><header><span>Tâches commerciales</span><a href="crm.html">CRM</a></header><main id="main" tabindex="-1"><h1>Tâches commerciales</h1><p class="muted">Appels, e-mails, relances et rendez-vous à réaliser. Les tâches en retard remontent dans les notifications. Recette interne uniquement.</p><section id="login"><h2>Accès réservé</h2><form id="login-form"><label>Clé de session<input id="token" type="password" required autocomplete="off"></label><button>Se connecter</button></form></section><p id="notice" role="status" aria-live="polite"></p><div id="workspace" hidden><div class="toolbar task-toolbar"><label>Vue<select id="view"><option value="mine">Mes tâches</option><option value="team">Toute l’équipe</option></select></label><label>État<select id="state"><option value="open">À faire</option><option value="done">Terminées</option></select></label><button id="logout" type="button">Se déconnecter</button></div><div id="task-kpis" class="kpis"></div><section id="task-new" hidden><h2>Nouvelle tâche</h2><form id="task-form" class="task-form"><label>Tâche<input name="title" required maxlength="180" placeholder="Ex. Appeler pour valider le périmètre"></label><label>Type<select name="kind"><option value="APPEL">Appel</option><option value="EMAIL">E-mail</option><option value="RELANCE">Relance</option><option value="RENDEZ_VOUS">Rendez-vous</option><option value="AUTRE">Autre</option></select></label><label>Échéance<input name="due_date" type="date" required></label><label>Opportunité<select name="opportunity_id" id="task-opportunity"><option value="">Aucune</option></select></label><label>Responsable<select name="owner_id" id="task-owner"><option value="me">Moi</option><option value="">Non attribuée</option></select></label><button>Ajouter la tâche</button></form></section><div id="task-groups" class="task-groups"></div></div></main></body></html>
