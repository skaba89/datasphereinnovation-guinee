<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>DSIG | Devis</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="tenders.css"><script src="quotes.js" defer></script><script src="shared-session.js" defer></script><link rel="stylesheet" href="accessibility.css"></head><body><a class="skip-link" href="#main">Aller au contenu</a>
<header><img src="dsig-mark.svg" alt="DSIG" width="100"><span>Devis et marges</span><a href="admin.html">Administration</a><a href="crm.html">CRM</a></header>
<main id="main" tabindex="-1"><h1>Propositions commerciales</h1><p>Recette interne. Montants estimatifs HT, sans facturation ni envoi automatique.</p><section id="login"><form id="login-form"><label>Clé d’administration<input id="token" type="password" required></label><button>Connexion</button></form></section><p id="notice" role="status"></p>
<div id="workspace" hidden><section><div class="toolbar"><h2 id="form-title">Nouveau devis</h2><button id="logout">Déconnexion</button></div><form id="editor" class="editor"><label>Rechercher une opportunité<input id="lookup"></label><div><button type="button" id="find">Rechercher</button></div><label class="wide">Opportunité CRM<select name="opportunity_id" required id="opportunity"><option value="">Sélectionner</option></select></label><label>Intitulé<input name="title" required maxlength="180"></label><label>Mode<select name="mode"><option value="REGIE">Régie</option><option value="FORFAIT">Forfait</option></select></label><label>Devise<select name="currency"><option>GNF</option><option>EUR</option><option>XOF</option><option>USD</option></select></label><label>Jours estimés<input name="days" type="number" min="0.01" step="0.01" required></label><label>TJM vendu (régie)<input name="rate" type="number" min="0" step="0.01" value="0" required></label><label>Coût journalier interne<input name="daily_cost" type="number" min="0" step="0.01" value="0" required></label><label>Frais directs internes<input name="expenses" type="number" min="0" step="0.01" value="0" required></label><label>Prix forfait HT<input name="fixed_price" type="number" min="0" step="0.01" value="0" required></label><label>Statut<select name="status"><option value="BROUILLON">Brouillon</option><option value="PROPOSE">Proposé</option><option value="ACCEPTE">Accepté</option><option value="REFUSE">Refusé</option></select></label><label class="wide">Périmètre et livrables<textarea name="scope" required maxlength="4000" rows="4"></textarea></label><label>Validité jusqu’au<input name="valid_until" type="date"></label><label class="wide">Conditions commerciales (visibles par le client)<textarea name="terms" maxlength="2000" rows="4"></textarea></label><div class="wide"><button id="save">Calculer et enregistrer</button> <button id="cancel" type="button">Nouveau devis</button></div></form></section><section><h2>Registre et prévisions par devis</h2><div class="dsig-pager"><label>Recherche<input id="list-search" type="search" placeholder="Rechercher…"></label><label>Éléments par page<select id="page-size"><option value="10">10</option><option value="25">25</option><option value="50">50</option></select></label></div><div class="table-wrap" tabindex="0" role="region" aria-label="Tableau 1 — défilement horizontal"><table><thead><tr><th scope="col">Client / devis</th><th scope="col">Statut</th><th scope="col">CA HT estimé</th><th scope="col">Coût direct</th><th scope="col">Marge brute</th><th scope="col">Actions</th></tr></thead><tbody id="rows"></tbody></table></div><div class="toolbar"><button id="prev">Précédent</button><span id="pages" role="status"></span><button id="next">Suivant</button></div></section></div><section id="proposal-preview" hidden><div class="toolbar proposal-controls"><button id="print-proposal" type="button">Imprimer / enregistrer en PDF</button><button id="close-proposal" type="button">Fermer</button></div><article id="proposal-document"></article></section></main></body></html>
