<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>DSIG | Espace client</title><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="accessibility.css"><link rel="stylesheet" href="client-portal.css"><script src="client-portal.js" defer></script></head>
<body><a class="skip-link" href="#main">Aller au contenu</a><header><img src="dsig-mark.svg" width="100" alt="DSIG"><span>Espace client</span><a href="connexion.html">Mon compte</a></header>
<main id="main" tabindex="-1"><h1>Mon espace client</h1><p id="notice" role="status">Vérification de la session…</p>
<section id="login"><a href="connexion.html">Se connecter avec le MFA</a></section>
<div id="workspace" hidden><h2 id="organization"></h2><button id="logout">Déconnexion</button>
<section><h2>Mes services</h2><div class="toolbar"><label>Registre<select id="kind"><option value="contracts">Contrats et prestations</option><option value="subscriptions">Abonnements SaaS</option><option value="invoices">Factures et règlements</option><option value="tickets">Demandes d’assistance</option></select></label><label>Recherche<input id="search" type="search" maxlength="120" placeholder="Rechercher…"></label></div><div id="rows"></div><div class="dsig-pager"><button id="prev">Précédent</button><span id="page" role="status"></span><button id="next">Suivant</button></div></section>
<section><h2>Nouvelle demande d’assistance</h2><form id="ticket"><label>Objet<input name="title" maxlength="180" required></label><label>Description<textarea name="description" maxlength="2000" required></textarea></label><button>Envoyer la demande</button></form></section></div></main></body></html>
