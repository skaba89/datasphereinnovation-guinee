<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>DSIG | Appels d’offres</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="tenders.css"><script src="tenders.js" defer></script><script src="shared-session.js" defer></script></head><body>
<header><img src="dsig-mark.svg" alt="DSIG" width="100"><span>Avant-vente et appels d’offres</span><a href="admin.html">Administration commerciale</a></header>
<main><h1>Registre des appels d’offres</h1><p class="muted">Recette interne : données fictives uniquement. Aucun dépôt ni envoi automatique.</p>
<section id="login"><h2>Accès réservé</h2><form id="login-form"><label>Clé d’administration<input id="token" type="password" required autocomplete="off"></label><button>Se connecter</button></form></section>
<p id="notice" role="status" aria-live="polite"></p>
<div id="workspace" hidden><section><div class="toolbar"><h2>Indicateurs de suivi</h2><button id="logout">Se déconnecter</button></div><div class="counts" id="counts"></div></section>
<section><h2 id="form-title">Nouvel appel d’offres</h2><form id="editor" class="editor"><label>Intitulé<input name="title" required maxlength="180"></label><label>Organisation<input name="client" required maxlength="180"></label><label>Référence<input name="reference" maxlength="120"></label><label>Échéance (date)<input name="deadline" type="date" required></label><label>Responsable<input name="owner" maxlength="120"></label><label>Statut<select name="stage" id="editor-stage"></select></label><label>Budget estimatif<input name="budget" inputmode="decimal" pattern="[0-9]{1,15}(\.[0-9]{1,2})?" placeholder="Facultatif"></label><label>Devise<select name="currency"><option>GNF</option><option>EUR</option><option>USD</option><option>XOF</option></select></label><label class="wide">Qualification, exigences, risques et prochaines actions<textarea name="notes" maxlength="4000" rows="5"></textarea></label><div class="wide"><button id="save">Enregistrer</button> <button type="button" id="cancel">Nouveau dossier</button></div></form></section>
<section><h2>Pipeline avant-vente</h2><form id="filter"><label>Recherche<input id="search" placeholder="Intitulé, client, référence"></label><label>Statut<select id="stage"><option value="">Tous</option></select></label><button>Filtrer</button></form><div class="table-wrap"><table><thead><tr><th>Dossier</th><th>Échéance</th><th>Statut</th><th>Budget</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div><div class="toolbar"><button id="prev">Précédent</button><span id="pages"></span><button id="next">Suivant</button></div></section></div></main></body></html>
