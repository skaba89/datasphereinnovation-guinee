<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>DSIG | Connexion</title><link rel="stylesheet" href="admin.css"><script src="connexion.js" defer></script></head><body><header><img src="dsig-mark.svg" alt="DSIG" width="100"><span>Espace professionnel</span><a href="index.html">Site vitrine</a></header><main><h1>Connexion sécurisée de recette</h1><p id="notice" role="status"></p><div id="login"><section><h2>Première activation</h2><form id="activate"><label>Identifiant<input name="username" required></label><label>Clé individuelle initiale<input name="key" type="password" required></label><label>Nouveau mot de passe<input name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label><button>Activer</button></form></section><section><h2>Connexion</h2><form id="signin"><label>Identifiant<input name="username" autocomplete="username" required></label><label>Mot de passe<input name="password" type="password" autocomplete="current-password" required></label><label>Code MFA (si activé)<input name="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></label><button>Connexion</button></form></section></div><section id="workspace" hidden><h2 id="role"></h2><p>Session partagée de 30 minutes.</p><button id="logout">Déconnexion</button><h3>Modules autorisés</h3><div id="modules" class="counts"></div><h3>Double authentification</h3><form id="mfa-setup"><label>Confirmer votre mot de passe<input name="password" type="password" required></label><button>Générer une clé TOTP</button></form><div id="mfa-pending" hidden><p>Configurez votre application TOTP (6 chiffres, 30 secondes).</p><label>Clé secrète<input id="secret" readonly></label><form id="mfa-confirm"><label>Code<input name="code" pattern="[0-9]{6}" required></label><button>Activer MFA</button></form></div></section></main></body></html>
