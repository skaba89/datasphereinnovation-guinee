services:
  dsig:
    build: .
    environment:
      DSIG_ENV: "${DSIG_ENV:-REC}"
      DSIG_ADMIN_TOKEN: "${DSIG_ADMIN_TOKEN:?Generate a private local administration key}"
      DSIG_MFA_KEY: "${DSIG_MFA_KEY:-}"
      DSIG_BACKUP_KEY: "${DSIG_BACKUP_KEY:-}"
      DSIG_DOCUMENT_KEY: "${DSIG_DOCUMENT_KEY:-}"
      DSIG_DOCUMENT_PREVIOUS_KEY: "${DSIG_DOCUMENT_PREVIOUS_KEY:-}"
      DSIG_CLAMD_SOCKET: "${DSIG_CLAMD_SOCKET:-}"
      DSIG_MFA_REQUIRED_ROLES: "${DSIG_MFA_REQUIRED_ROLES-DIRECTION,CONTROLE,COMPTABLE,AUDITEUR}"
    ports:
      - "127.0.0.1:${DSIG_PORT:-8080}:8080"
    volumes:
      - dsig-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  dsig-data:
